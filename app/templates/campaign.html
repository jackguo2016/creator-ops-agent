{% extends "base.html" %}
{% block title %}项目 Brief{% endblock %}
{% block content %}
<h1>项目 Brief</h1>
<p>把业务目标转成可执行的筛选、沟通和验收标准。</p>
{% if errors %}
<section aria-label="表单错误">
  <h2>请检查以下内容</h2>
  <ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>
</section>
{% endif %}
<form method="post" action="/campaigns/{{ campaign.id }}">
  <label>品牌<input name="brand" value="{{ values.brand }}" required></label>
  <label>项目名称<input name="name" value="{{ values.name }}" required></label>
  <label>目标市场<input name="market" value="{{ values.market }}" required></label>
  <label>内容语言<input name="language" value="{{ values.language }}" required></label>
  <label>平台<input name="platforms" value="{{ values.platforms }}" required></label>
  <label>创作者类别<input name="categories" value="{{ values.categories }}" required></label>
  <label>最少粉丝数<input name="min_followers" type="number" min="0" value="{{ values.min_followers }}" required></label>
  <label>最多粉丝数<input name="max_followers" type="number" min="0" value="{{ values.max_followers }}" required></label>
  <label>单人预算<input name="max_fee" type="number" min="0" step="0.01" value="{{ values.max_fee }}" required></label>
  <label>总预算<input name="total_budget" type="number" min="0" step="0.01" value="{{ values.total_budget }}" required></label>
  <label>截止日期<input name="deadline" type="date" value="{{ values.deadline }}" required></label>
  <label>交付要求<textarea name="deliverables" required>{{ values.deliverables }}</textarea></label>
  <label>限制与检查规则<textarea name="restrictions" required>{{ values.restrictions }}</textarea></label>
  <label>自由文本 Brief<textarea name="brief_text" required>{{ values.brief_text }}</textarea></label>
  <button type="submit">保存 Brief</button>
</form>
{% endblock %}
